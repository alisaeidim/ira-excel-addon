
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>قیمت طلا ایرا</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      padding: 20px;
      color: #333;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      margin: 7px 0;
      font-size: 14px;
    }
    button {
      background: #b08d45;
      color: white;
      border: 0;
      cursor: pointer;
    }
    #status {
      margin-top: 12px;
      line-height: 1.8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h3>قیمت لحظه‌ای طلا | ایرا</h3>

  <label for="cell">سلول مقصد در اکسل:</label>
  <input id="cell" value="B2" dir="ltr">

  <button id="update">دریافت و ثبت آخرین قیمت</button>

  <div id="status">آماده دریافت قیمت</div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbyYsdnW8S54LWC2nqztUGiMEt9uu2_2ApHdci6ud1mTivasmtKh19q4uFrLnm_s5ine/exec";

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    function getGoldPrice() {
      return new Promise((resolve, reject) => {
        const callbackName =
          "iraPriceCallback_" + Date.now();

        const script = document.createElement("script");

        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error("پاسخی از سرور دریافت نشد."));
        }, 15000);

        function cleanup() {
          clearTimeout(timeout);
          delete window[callbackName];
          script.remove();
        }

        window[callbackName] = function(data) {
          cleanup();

          if (!data || !data.success) {
            reject(new Error(data?.error || "دریافت قیمت ناموفق بود."));
            return;
          }

          resolve(data);
        };

        script.onerror = function() {
          cleanup();
          reject(new Error("خطا در اتصال به API قیمت طلا."));
        };

        script.src =
          API_URL + "?callback=" + callbackName;

        document.head.appendChild(script);
      });
    }

    async function updateExcel() {
      const cell = document.getElementById("cell").value.trim();

      if (!cell) {
        setStatus("آدرس سلول را وارد کن.");
        return;
      }

      try {
        setStatus("در حال دریافت قیمت...");

        const data = await getGoldPrice();

        await Excel.run(async (context) => {
          const sheet = context.workbook.worksheets.getItemAt(0);
          const range = sheet.getRange(cell);

          range.values = [[data.price]];
          range.numberFormat = [["#,##0"]];

          await context.sync();
        });

        setStatus(
          "قیمت با موفقیت ثبت شد: " +
          Number(data.price).toLocaleString("en-US") +
          " " + data.currency
        );

      } catch (error) {
        setStatus("خطا: " + error.message);
      }
    }

    Office.onReady(function(info) {
      if (info.host === Office.HostType.Excel) {
        document.getElementById("update")
          .addEventListener("click", updateExcel);

        setStatus("افزونه آماده است.");
      } else {
        setStatus("این افزونه باید در Excel اجرا شود.");
      }
    });
  </script>
</body>
</html>
