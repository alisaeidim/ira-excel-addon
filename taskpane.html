<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IRA MOJODI | قیمت آبشده نقدی</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: Tahoma, Arial, sans-serif;
      margin: 0;
      padding: 18px;
      color: #282828;
      background: #fff;
    }
    .brand { color: #9b7937; font-size: 12px; letter-spacing: .5px; }
    h2 { margin: 6px 0 4px; font-size: 19px; }
    .sub { color: #777; font-size: 12px; margin-bottom: 18px; }
    .price-card {
      border: 1px solid #e7dfcf;
      border-radius: 12px;
      padding: 14px;
      margin: 12px 0;
      background: #fcfaf6;
    }
    .price-label { color: #777; font-size: 12px; }
    #price { font-size: 27px; font-weight: bold; margin-top: 8px; direction: ltr; text-align: right; }
    #currency { color: #777; font-size: 12px; margin-top: 4px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      font: inherit;
      cursor: pointer;
      background: #a88948;
      color: white;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status { font-size: 12px; line-height: 1.9; margin-top: 12px; color: #555; }
    .meta { font-size: 11px; color: #888; line-height: 1.9; margin-top: 10px; }
    .ok { color: #267447 !important; }
    .err { color: #b42318 !important; }
  </style>
</head>
<body>
  <div class="brand">IRA | ایرا</div>
  <h2>قیمت آبشده نقدی</h2>
  <div class="sub">دریافت از Google Sheets و ثبت در فایل IRA MOJODI</div>

  <div class="price-card">
    <div class="price-label">آخرین قیمت هر گرم</div>
    <div id="price">—</div>
    <div id="currency">تومان</div>
  </div>

  <button id="update" type="button" disabled>در حال آماده‌سازی افزونه...</button>
  <div id="status" role="status" aria-live="polite">در انتظار اتصال به Excel...</div>
  <div class="meta">
    مقصد: شیت «وضعیت» · سلول G3<br>
    به‌روزرسانی خودکار: هر ۵ دقیقه تا وقتی پنل افزونه باز است
  </div>

<script>
  "use strict";

  const API_URL = "https://script.google.com/macros/s/AKfycbyYsdnW8S54LWC2nqztUGiMEt9uu2_2ApHdci6ud1mTivasmtKh19q4uFrLnm_s5ine/exec";
  const TARGET_SHEET = "وضعیت";
  const TARGET_CELL = "G3";
  const REFRESH_MS = 5 * 60 * 1000;

  let isUpdating = false;
  let refreshTimer = null;

  const button = document.getElementById("update");
  const statusBox = document.getElementById("status");
  const priceBox = document.getElementById("price");

  function setStatus(message, kind) {
    statusBox.textContent = message;
    statusBox.className = kind || "";
  }

  function formatPrice(value) {
    return Number(value).toLocaleString("en-US", {
      maximumFractionDigits: 0
    });
  }

  // Google Apps Script JSONP: avoids browser CORS restrictions.
  function getGoldPrice() {
    return new Promise((resolve, reject) => {
      const callbackName = "iraGoldCallback_" +
        Date.now() + "_" + Math.floor(Math.random() * 100000);

      const script = document.createElement("script");
      let finished = false;

      const timeout = setTimeout(() => {
        finish();
        reject(new Error("پاسخی از سرویس قیمت دریافت نشد."));
      }, 20000);

      function finish() {
        if (finished) return;
        finished = true;
        clearTimeout(timeout);
        try { delete window[callbackName]; } catch (_) {
          window[callbackName] = undefined;
        }
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[callbackName] = (data) => {
        finish();
        if (!data || data.success !== true) {
          reject(new Error((data && data.error) || "دریافت قیمت ناموفق بود."));
          return;
        }
        const price = Number(data.price);
        if (!Number.isFinite(price) || price <= 0) {
          reject(new Error("قیمت دریافتی معتبر نیست."));
          return;
        }
        resolve(data);
      };

      script.onerror = () => {
        finish();
        reject(new Error("خطا در اتصال به API گوگل شیت."));
      };

      script.src = API_URL +
        "?callback=" + encodeURIComponent(callbackName) +
        "&_=" + Date.now();

      document.head.appendChild(script);
    });
  }

  async function updateExcel() {
    if (isUpdating) return;
    isUpdating = true;
    button.disabled = true;
    button.textContent = "در حال دریافت قیمت...";
    setStatus("در حال دریافت آخرین قیمت از Google Sheets...");

    try {
      const data = await getGoldPrice();

      await Excel.run(async (context) => {
        const sheet = context.workbook.worksheets.getItem(TARGET_SHEET);
        const target = sheet.getRange(TARGET_CELL);
        target.values = [[Number(data.price)]];
        target.numberFormat = [["#,##0"]];
        await context.sync();
      });

      priceBox.textContent = formatPrice(data.price);
      const now = new Date();
      const timeText = now.toLocaleString("fa-IR");
      const rateType = data.rate_type ? " · نوع نرخ: " + data.rate_type : "";
      setStatus("قیمت با موفقیت در وضعیت!G3 ثبت شد. آخرین به‌روزرسانی: " +
        timeText + rateType, "ok");
    } catch (error) {
      setStatus("خطا: " + (error && error.message ? error.message : String(error)), "err");
    } finally {
      isUpdating = false;
      button.disabled = false;
      button.textContent = "دریافت و ثبت قیمت";
    }
  }

  Office.onReady((info) => {
    if (info.host !== Office.HostType.Excel) {
      setStatus("این افزونه باید در Excel اجرا شود.", "err");
      return;
    }

    button.disabled = false;
    button.textContent = "دریافت و ثبت قیمت";
    button.addEventListener("click", updateExcel);

    // Initial update when the task pane opens.
    updateExcel();

    // Automatic refresh every five minutes while the task pane remains open.
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(updateExcel, REFRESH_MS);
  });
</script>
</body>
</html>
